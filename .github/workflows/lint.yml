name: Lint

# Node half of the merge gate. Must stay identical to `npm run test:ci`.
# The full local gate (this job + the blocking ci.yml jobs) is `npm run verify:ci`.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node CI gate
        run: npm run test:ci
